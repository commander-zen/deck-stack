<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="18" fill="#0d0d0f"/>

  <!-- Card back (rightmost, rotated clockwise) -->
  <rect x="28" y="18" width="44" height="62" rx="6" fill="#1a2040"
        transform="rotate(9, 50, 49)"/>

  <!-- Card middle -->
  <rect x="28" y="18" width="44" height="62" rx="6" fill="#2e4080"
        transform="rotate(3, 50, 49)"/>

  <!-- Card front (blue, slight counter-tilt) -->
  <rect x="28" y="18" width="44" height="62" rx="6" fill="#5b8fff"
        transform="rotate(-3, 50, 49)"/>

  <!-- Subtle highlight on front card top edge -->
  <rect x="28" y="18" width="44" height="3" rx="3" fill="rgba(255,255,255,0.18)"
        transform="rotate(-3, 50, 49)"/>
</svg>
